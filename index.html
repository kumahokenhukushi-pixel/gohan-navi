<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a2f1f">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>くまむら ごはんナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: やさしく、はっきり。高齢の方でも迷わない大きな文字とボタン
   IDEA: 一汁三菜のお膳。記録するとお膳に器がそろっていく
   PICTURE: 漆塗りのお膳（主食・主菜・副菜・汁物・果物/乳）
   COLOUR and TYPE: 漆の赤茶を主に、野菜の緑を補助、卵黄の黄をアクセント／Zen Maru Gothic
   LAYOUT: 1列のスマホ画面、下にタブ。上から お膳→今日の数字→食事ごとの提案 */
:root{color-scheme:light dark;
--bg:light-dark(#fbf6ee,#1b1411);--card:light-dark(#ffffff,#2a201b);--ink:light-dark(#2b1d17,#f6ece4);
--sub:light-dark(#6f5a50,#c9b6aa);--line:light-dark(#eadfd3,#43352d);--lac:light-dark(#8a2f1f,#c4553d);
--lac2:light-dark(#6e2418,#a8432e);--leaf:light-dark(#3d7a45,#7cc184);--leafbg:light-dark(#e7f2e4,#24362a);
--yolk:#f2b632;--yolkbg:light-dark(#fff3d1,#3d3115);--warn:light-dark(#b3261e,#ff8a80);--warnbg:light-dark(#fde8e5,#4a2320)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
.top{background:var(--lac);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;font-weight:900;flex:1}
.top small{font-size:13px;opacity:.85;font-weight:500}
main{max-width:640px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:20px;margin-bottom:8px}
.muted{color:var(--sub);font-size:15px}
.small{font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:14px;border:2px solid var(--lac);background:var(--lac);color:#fff;font-weight:700;cursor:pointer;font-size:17px}
.btn.ghost{background:transparent;color:var(--lac)}
.btn.leaf{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:6px 12px;font-size:15px;border-radius:12px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 140px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:16px}
.chip[aria-pressed=true]{background:var(--lac);border-color:var(--lac);color:#fff;font-weight:700}
.chip.leafc[aria-pressed=true]{background:var(--leaf);border-color:var(--leaf)}
label.f{display:block;margin:12px 0 4px;font-weight:700}
input[type=number],input[type=text],input[type=search],select,textarea{width:100%;min-height:50px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);font-size:17px}
textarea{min-height:120px;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.unit{display:flex;align-items:center;gap:8px}.unit span{white-space:nowrap;color:var(--sub);font-size:15px}
/* お膳 */
.ozen{position:relative}
.ozen svg{width:100%;height:auto;display:block}
.big{font-size:clamp(34px,10vw,46px);font-weight:900;line-height:1.05;white-space:nowrap}
.meter{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--leaf)}
.meter i.over{background:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{background:var(--bg);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:20px;white-space:nowrap}
.stat span{font-size:13px;color:var(--sub)}
/* 食事タブ */
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.slot{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:17px;line-height:1.2;padding:4px}
.slot small{display:block;font-size:12px;font-weight:500;color:var(--sub)}
.slot[aria-pressed=true]{border-color:var(--lac);background:var(--lac);color:#fff}
.slot[aria-pressed=true] small{color:#fff}
.prop{border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:var(--card)}
.prop h3{font-size:17px;color:var(--lac);margin-bottom:6px}
.dish{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line)}
.dish:last-of-type{border-bottom:0}
.dish .tag{flex:none;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--sub)}
.dish .nm{flex:1}
.dish .kc{flex:none;white-space:nowrap;color:var(--sub);font-size:15px}
.t-主食{background:var(--yolkbg)!important;color:light-dark(#7a5600,#ffd77a)!important}
.t-主菜{background:var(--warnbg)!important;color:var(--lac)!important}
.t-副菜{background:var(--leafbg)!important;color:var(--leaf)!important}
.why{margin:8px 0 10px;font-size:15px;color:var(--sub)}
.why b{color:var(--ink)}
.note{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px;background:var(--yolkbg)}
.note.warn{background:var(--warnbg);color:var(--ink)}
.note.ok{background:var(--leafbg)}
.eaten{border:2px solid var(--leaf);border-radius:16px;padding:12px 14px;margin-bottom:12px;background:var(--leafbg)}
.eaten h3{font-size:17px;color:var(--leaf);margin-bottom:4px}
.del{flex:none;border:0;background:transparent;color:var(--sub);font-size:22px;width:44px;height:44px;cursor:pointer;border-radius:10px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--sub)}
.badge.rec{background:var(--leaf);color:#fff}
.badge.cau{background:var(--warnbg);color:var(--warn)}
.list .item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item .nm{flex:1}
.list .item .kc{white-space:nowrap;color:var(--sub);font-size:15px;text-align:right}
/* 目安表 */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--sub);font-weight:700}
td:first-child{font-weight:700;white-space:nowrap}
.hl{color:var(--lac);font-weight:700}
.ptrow{padding:10px 0;border-bottom:1px solid var(--line)}.ptrow:last-child{border-bottom:0}
/* 週グラフ */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:170px;position:relative;margin-top:8px}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;border:0;background:none;padding:0}
.wk i{display:block;width:70%;border-radius:8px 8px 3px 3px;background:var(--leaf)}
.wk i.over{background:var(--warn)}.wk i.none{background:var(--line)}
.wk span{font-size:13px;color:var(--sub);margin-top:4px;white-space:nowrap}
.wk[aria-pressed=true] span{color:var(--ink);font-weight:900}
.tline{position:absolute;left:0;right:0;border-top:2px dashed var(--lac);pointer-events:none}
.tline em{position:absolute;right:0;top:-22px;font-size:12px;font-style:normal;color:var(--lac);background:var(--card);padding:0 4px}
/* タブバー */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{min-height:64px;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:700;color:var(--sub)}
.tab svg{width:26px;height:26px}
.tab[aria-current=page]{color:var(--lac)}
/* シート */
.sheet{position:fixed;inset:0;background:rgba(20,10,5,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .head{display:flex;align-items:center;gap:8px;margin-bottom:8px;position:sticky;top:-16px;background:var(--bg);padding:8px 0;z-index:1}
.sheet .head h2{flex:1;font-size:20px}
.steps{display:flex;gap:6px;margin-bottom:10px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--lac)}
.qty{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.datebar b{flex:1;text-align:center;font-size:18px}
.datebar button{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.testbar{background:var(--yolkbg);color:var(--ink);font-size:14px;padding:8px 16px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.testbar button{border:0;background:none;color:var(--lac);font-weight:700;text-decoration:underline;cursor:pointer;font-size:14px;min-height:32px}
.foot{font-size:13px;color:var(--sub);text-align:center;margin:10px 0 20px}
@media (prefers-reduced-motion:no-preference){.ozen .bowl{transition:fill .5s,opacity .5s}}
</style>
</head>

</nav>

const jdate = s => { const d = parseD(s); return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
function seeded(str){ let h = 1779033703 ^ str.length; for (let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }

/* ---------- 計算（教材_食事と同じ式） ---------- */
function calc(){
  const p = S.p, k = S.ken, L = S.life, now = new Date();
  let age = null;
  if (p.by){ age = now.getFullYear() - p.by - ((now.getMonth()+1) < (p.bm||1) ? 1 : 0); }
  const ht = num(p.ht), wt = num(p.wt), female = p.sex === '女性';
  const bmi = ht && wt ? r1(wt / (ht/100) ** 2) : null;
  const std = ht ? r1((ht/100) ** 2 * 22) : null;
  let tw = null;
  if (ht && wt) tw = L.tw === 0 ? r1((ht/100) ** 2 * 22) : L.tw === 1 ? r1(wt * 0.97) : wt;
  let base = null, act = null;
  if (age != null && age >= 18){ let row = BMR[0]; for (const r of BMR) if (age >= r[0]) row = r; base = female ? row[2] : row[1]; act = row[3 + (L.act ?? 1)]; }
  const E = tw && base && act ? Math.round(tw * base * act / 10) * 10 : null;
  const rice = E ? Math.round(E * 0.4 / 1.56 / 3 / 10) * 10 : null;
  const bowl = rice ? r1(rice / 150) : null;
  const oil = E ? Math.max(0.5, Math.round(E * 0.06 / 111 * 2) / 2) : null;
  const hi = (key, th, dir) => { const v = num(k[key]); return v != null && (dir === 'up' ? v >= th : v < th); };
  const up = ['±','＋','２＋','３＋'].includes(k.uprot);
  const f = {bp: hi('sbp',130,'up') || hi('dbp',85,'up'), tg: hi('tg',150,'up'), hdl: hi('hdl',40,'down'), ldl: hi('ldl',120,'up'),
    liv: hi('alt',31,'up') || hi('ggt',51,'up'), glu: hi('glu',100,'up') || hi('a1c',5.6,'up'), egfr: hi('egfr',60,'down'), uprot: up, ua: hi('ua',7.1,'up'),
    medBp: k.medBp === 'あり', medGlu: k.medGlu === 'あり', a1c65: (num(k.a1c) ?? 0) >= 6.5};
  const salt = (f.bp || f.medBp) ? 6 : female ? 6.5 : 7.5;
  const fruitHalf = f.tg || f.glu;
  const pts = [
    ['肉','60〜80g（手のひら半分）', f.ldl ? '脂身の少ない部位（もも・ヒレ・皮なし鶏肉）に。ベーコン・ソーセージは控えめに' : '脂身の少ない部位を選びましょう'],
    ['魚','60〜80g（切り身1切れ）', (f.tg || f.hdl) ? 'さば・いわし・さんまなど青魚を週3回以上' : '肉と魚は1日おきくらいに'],
    ['卵','1個', f.ldl ? 'LDLが高めなので 1日1/2個 に' : '1日1個まで'],
    ['大豆製品','豆腐1/3丁 か 納豆1パック','肉の代わりにも使えます'],
    ['野菜','350g以上（両手山盛り）', f.glu ? '食事の最初に野菜から食べると、血糖が上がりにくくなります' : 'きのこ・海藻もあわせて毎食に'],
    ['果物', fruitHalf ? '100g（みかん1個）' : '200g（みかん2個）', fruitHalf ? '中性脂肪・血糖が高めなので量を半分に。夜より朝に' : '食べすぎに注意'],
    ['牛乳・乳製品','牛乳コップ1杯（200ml）', f.ldl ? '低脂肪乳やヨーグルト（無糖）に' : ''],
    ['塩分', salt + 'g未満', f.bp ? '血圧が高めです。汁物は1日1杯、麺の汁は残す、漬物・干物を控える' : '汁物・漬物の量に気をつけて'],
    ['お酒','日本酒1合（ビール中瓶1本）まで', (f.liv || f.tg || f.ua) ? '肝臓・中性脂肪・尿酸のため、量を守り週2日は飲まない日を' : '週2日は飲まない日を'],
    ['甘い飲み物・お菓子','できるだけ控える', (f.tg || f.glu || f.liv) ? 'ジュース・缶コーヒー・菓子パンは中性脂肪・血糖・肝臓の脂肪のもとに' : '間食は1日200kcalまで']];
  const notes = [];
  if (f.egfr || f.uprot) notes.push('腎臓の数値（eGFR・尿たんぱく）に注意があります。たんぱく質や塩分の量は、医師・管理栄養士に相談してください。');
  if (f.a1c65 || f.medGlu) notes.push('血糖の治療中・血糖が高い人は、主治医の指示エネルギーを優先してください。');
  return {age, ht, wt, bmi, std, tw, base, act, E, rice, bowl, oil, f, salt, pts, notes, female};
}

/* ---------- 苦手・冷蔵庫 ---------- */
function disTokens(){ const t = new Set(); for (const [l, toks] of DISLIKES) if (S.dis.includes(l)) toks.forEach(x => t.add(x)); return t; }
function disliked(d, toks){
  if (d.i.some(x => toks.has(x)) || d.t.some(x => toks.has(x))) return true;
  const words = (S.disText || '').split(/[、,，\s]+/).map(w => hira(w.trim())).filter(Boolean);
  return words.some(w => hira(d.n).includes(w) || d.i.some(x => hira(x).includes(w)));
}
const fridgeHits = d => d.i.filter(x => S.fridge.includes(x) || (x === 'ひき肉' && S.fridge.includes('ひき肉')));

/* ---------- 献立の提案 ---------- */
function riceItem(C, g){ g = g || C.rice || 150; return {id:'rice', n:`ごはん ${g}g`, c:'主食', k:Math.round(g*1.56), s:0, v:0, q:1}; }
const asItem = (d, q=1) => ({id:d.id, n:d.n, c:d.c, k:d.k, s:d.s, v:d.v, q});
const PCACHE = {};
function propose(date, slot, C){
  const key = JSON.stringify([date, slot, S.regen, S.fridge, S.dis, S.disText, S.p, S.ken, S.life, S.logs[date]]);
  if (PCACHE[slot] && PCACHE[slot].key === key) return PCACHE[slot].v;
  const prev = new Set();
  for (const s of ['朝','昼','夕']){ if (s === slot) break; const pp = propose(date, s, C); if (pp[0]) pp[0].items.forEach(x => prev.add(x.id)); }
  const v = propose1(date, slot, C, prev); PCACHE[slot] = {key, v}; return v;
}
function propose1(date, slot, C, prev){
  const T = (C.E || 1800) * SHARE[slot], f = C.f, toks = disTokens(), saltCap = C.salt * SHARE[slot];
  const eatenToday = new Set(Object.values(S.logs[date] || {}).flat().map(x => x.id).concat([...prev]));
  const rng = seeded(`${date}|${slot}|${S.regen[date+slot]||0}|${S.fridge.join()}|${S.dis.join()}`);
  const pool = c => DISHES.filter(d => d.c === c && d.g.includes('家') && d.m.includes(slot) && !d.t.includes('提案なし') && !disliked(d, toks));
  const mains = pool('主菜'), sides = pool('副菜').filter(d => d.v >= 40), soups = pool('汁物');
  const scoreMain = d => { let s = 1 + fridgeHits(d).length * 3;
    if ((f.bp || f.medBp) && (d.s > 1.5 || d.t.includes('干物') || d.t.includes('塩辛'))) s -= 4;
    if (f.ldl && (d.t.includes('卵2') || d.t.includes('揚げ'))) s -= 4;
    if ((f.tg || f.glu) && d.t.includes('揚げ')) s -= 2;
    if (d.t.includes('脂')) s -= f.ldl ? 3 : f.tg ? 1.5 : 0.5;
    if ((f.tg || f.hdl) && d.i.includes('青魚')) s += 2;
    if (eatenToday.has(d.id)) s -= 3;
    if (slot === '朝' && d.k > 200) s -= 2;
    return s; };
  const scoreSide = d => { let s = 1 + fridgeHits(d).length * 3 + (d.v >= 70 ? 1 : 0);
    if ((f.bp || f.medBp) && (d.s > 0.8 || d.t.includes('漬物'))) s -= 3; if (eatenToday.has(d.id)) s -= 2; return s; };
  const pick = (arr, sc, avoid) => { const a = arr.filter(d => !avoid.has(d.id)); if (!a.length) return null;
    const w = a.map(d => Math.max(0.25, sc(d)) ** 2); let r = rng() * w.reduce((x,y) => x+y, 0);
    for (let i=0;i<a.length;i++){ r -= w[i]; if (r <= 0) return a[i]; } return a[a.length-1]; };
  const bread = DISHES.find(d => d.n === '食パン（6枚切り）');
  const soupToday = (f.bp || f.medBp) ? slot === '夕' : slot !== '昼';
  const out = [], used = new Set();
  for (let n = 0; n < 3; n++){
    let best = null;
    for (let tries = 0; tries < 25; tries++){
      const items = [];
      if (slot === '朝' && n === 2 && bread && !disliked(bread, toks)) items.push(asItem(bread)); else items.push(riceItem(C));
      const m = pick(mains, scoreMain, used); if (!m) break; items.push(asItem(m));
      const sd = pick(sides, scoreSide, new Set([m.id])); if (sd) items.push(asItem(sd));
      if (soupToday && soups.length){ const sp = pick(soups.filter(d => !(f.bp || f.medBp) || d.s <= 1.5), d => 1 + fridgeHits(d).length*2, new Set()); if (sp) items.push(asItem(sp)); }
      let tot = items.reduce((a,x) => a + x.k, 0);
      if (slot === '朝'){
        const dairy = DISHES.find(d => d.n === (f.ldl ? 'ヨーグルト（無糖）' : '牛乳'));
        if (dairy && !disliked(dairy, toks) && tot + dairy.k < T * 1.1){ items.push(asItem(dairy)); tot += dairy.k; }
        const fr = DISHES.filter(d => d.c === '果物' && !disliked(d, toks)); const fx = fr[Math.floor(rng()*fr.length)];
        if (fx && tot + fx.k < T * 1.15){ items.push(asItem(fx)); tot += fx.k; }
      } else if (tot < T * 0.85){
        const s2 = pick(sides.filter(d => d.s <= 0.6), scoreSide, new Set(items.map(x => x.id))); if (s2){ items.push(asItem(s2)); tot += s2.k; }
      }
      const salt = items.reduce((a,x) => a + x.s, 0);
      const pen = Math.abs(tot - T) / T + Math.max(0, salt - saltCap) / saltCap * 1.2 - scoreMain(m) * 0.03;
      if (!best || pen < best.pen) best = {items, tot, pen, main:m};
    }
    if (!best) break;
    used.add(best.main.id); out.push(best);
  }
  return out.map(b => ({items:b.items, k:b.items.reduce((a,x)=>a+x.k,0), s:r1(b.items.reduce((a,x)=>a+x.s,0)), why:whyText(b.items, f)}));
}
function whyText(items, f){
  const hits = [...new Set(items.flatMap(x => BYID[x.id] ? fridgeHits(BYID[x.id]) : []))];
  const w = [];
  if (hits.length) w.push(`冷蔵庫の <b>${hits.map(esc).join('・')}</b> を使います`);
  if ((f.tg || f.hdl) && items.some(x => BYID[x.id]?.i.includes('青魚'))) w.push('青魚で中性脂肪・HDL対策');
  if (f.bp && items.some(x => x.c === '汁物')) w.push('汁物はこの1杯だけに');
  if (f.glu) w.push('野菜のおかずから先に食べましょう');
  return w.join('。');
}

/* ---------- 記録 ---------- */
function dayLog(date){ return S.logs[date] || {}; }
function addItems(date, slot, items){ S.logs[date] = S.logs[date] || {}; S.logs[date][slot] = (S.logs[date][slot] || []).concat(items.map(x => ({...x}))); save(); }
function totals(date){
  let k = 0, s = 0, v = 0, unknown = 0; const L = dayLog(date);
  for (const sl in L) for (const x of L[sl]){ if (x.k == null) unknown++; else k += x.k * x.q; s += (x.s || 0) * x.q; v += (x.v || 0) * x.q; }
  return {k, s:r1(s), v:Math.round(v), unknown};
}
function balance(items){
  const has = c => items.some(x => x.c === c);
  return {shu: has('主食') || has('一品'), sai: has('主菜') || has('一品'), fuku: has('副菜') || items.some(x => (x.v||0) >= 70), shiru: has('汁物'), extra: has('果物') || has('乳製品')};
}

/* ---------- 画面 ---------- */
let showProps = false, tab = 'today', curDate = today(), curSlot = autoSlot(), logDate = today(), outGenre = '定食';
function autoSlot(){ const h = new Date().getHours(); return h < 10 ? '朝' : h < 15 ? '昼' : '夕'; }
function go(t){ tab = t; document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === t ? 'page' : 'false')); render(); window.scrollTo(0,0); }
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));

function render(){
  if (!S.done){ $('#view').innerHTML = welcome(); return; }
  $('#view').innerHTML = tab === 'today' ? vToday() : tab === 'out' ? vOut() : tab === 'log' ? vLog() : vMe();
}
function welcome(){
  return `<div class="card"><div class="ozen">${ozen({shu:1,sai:1,fuku:1,shiru:1,extra:1})}</div>
  <h2 style="font-size:26px;margin-top:10px">あなたに合った食事を、毎日いっしょに。</h2>
  <p>健診の結果と、ふだんの生活を入れると、1日の食事の目安と献立を提案します。食べたものは、えらぶだけで記録できます。</p>
  <p class="muted">入力した内容は、このスマホの中だけに保存されます。役場や他の人には送られません。</p>
  <button class="btn wide" data-act="setup">はじめる（3分ほど）</button></div>
  <p class="foot">球磨村 保健福祉課（試作版・内容は栄養士が確認中です）</p>`;
}

function vToday(){
  const C = calc(), t = totals(curDate), L = dayLog(curDate), items = L[curSlot] || [];
  const all = Object.values(L).flat();
  const pct = C.E ? Math.min(100, t.k / C.E * 100) : 0, spct = Math.min(100, t.s / C.salt * 100);
  let h = `<div class="datebar"><button data-act="day" data-n="-1" aria-label="前の日">‹</button><b>${jdate(curDate)}${curDate===today()?'　きょう':''}</b><button data-act="day" data-n="1" aria-label="次の日">›</button></div>`;
  h += `<div class="card"><div class="ozen">${ozen(balance(curSlot === '間' ? all : items))}</div>
   <p class="muted small" style="margin:6px 0 0;text-align:center">${curSlot === '間' ? '1日の' : SLOTS.find(s=>s.k===curSlot).l + 'ごはんの'}そろい具合（器に色がつきます）</p>
   <div style="margin-top:10px"><span class="muted">きょう食べた量</span>
   <div><span class="big">${fmt(t.k)}</span> <span class="muted">/ ${C.E ? fmt(C.E) : '－'} kcal</span></div>
   <div class="meter"><i class="${t.k > (C.E||1e9) ? 'over':''}" style="width:${pct}%"></i></div></div>
   <div class="stats"><div class="stat"><span>のこり</span><b>${C.E ? fmt(Math.max(0, C.E - t.k)) : '－'}</b><span>kcal</span></div>
   <div class="stat"><span>塩分</span><b>${t.s}g</b><span>目安 ${C.salt}g未満</span></div>
   <div class="stat"><span>野菜</span><b>${t.v}g</b><span>目安 350g</span></div></div>
   ${t.unknown ? `<p class="muted small" style="margin:8px 0 0">※カロリーがわからない料理が ${t.unknown} 品あります（合計に入っていません）</p>` : ''}</div>`;
  C.notes.forEach(n => h += `<div class="note warn">●${esc(n)}</div>`);
  if (C.E && t.k > C.E * 1.05 && curSlot !== '間') h += `<div class="note">今日は目安より ${fmt(t.k - C.E)}kcal 多めです。次の食事はごはんを少なめにして、揚げ物を避け、野菜のおかずを中心にしましょう。1日で取り戻せなくても、2〜3日で調整すれば大丈夫です。</div>`;
  h += `<div class="slots" role="group" aria-label="食事">${SLOTS.map(s => { const n = (L[s.k]||[]).length; return `<button class="slot" data-act="slot" data-s="${s.k}" aria-pressed="${s.k===curSlot}">${s.l}<small>${n ? n+'品 記録済み' : '未記録'}</small></button>`; }).join('')}</div>`;
  if (items.length){
    const k = items.reduce((a,x) => a + (x.k||0)*x.q, 0);
    h += `<div class="eaten"><h3>✓ 食べたもの（${fmt(k)} kcal）</h3>${items.map((x,i) => `<div class="dish"><span class="tag t-${esc(x.c)}">${esc(x.c)}</span><span class="nm">${esc(x.n)}${x.q!==1?(BYID[x.id]?.t.includes('皿')?` ${x.q}皿`:` ×${x.q}`):''}</span><span class="kc">${x.k==null?'－':fmt(x.k*x.q)+' kcal'}</span><button class="del" data-act="del" data-i="${i}" aria-label="${esc(x.n)}を消す">×</button></div>`).join('')}</div>`;
  }
  h += `<div class="row" style="margin-bottom:14px"><button class="btn ghost" data-act="other">＋ その他を入力</button><button class="btn ghost" data-act="fridge">冷蔵庫の食材${S.fridge.length ? `（${S.fridge.length}）` : ''}</button></div>`;
  if (curSlot === '間'){

function vOut(){
  const C = calc(), f = C.f, toks = disTokens(), T = (C.E || 1800) * .35;
  const list = DISHES.filter(d => d.g.includes(outGenre) && !disliked(d, toks));
  const sc = d => { let s = 0; const unit = d.c === '一品' && !d.t.includes('皿');
    if (d.t.includes('マヨ')) s -= (f.ldl || f.tg) ? 1.2 : .6; if (d.t.includes('甘い') && (f.glu || f.tg)) s -= .8;
    if (unit) s -= Math.abs(d.k - T) / T * 3; else s -= d.k / 400;
    if (d.t.includes('揚げ')) s -= (f.ldl || f.tg || f.glu) ? 2 : 1;
    if (d.t.includes('塩辛') || d.s >= 4) s -= (f.bp || f.medBp) ? 2 : .8;
    if (d.v >= 70) s += 1; if (d.i.includes('青魚') && (f.tg || f.hdl)) s += .8;
    if (d.c === 'お酒' || d.c === '飲み物' || d.c === '間食') s -= 3; return s; };
  const isMeal = d => ['一品','主菜','主食'].includes(d.c);
  const meals = list.filter(isMeal).sort((a,b) => sc(b) - sc(a)), others = list.filter(d => !isMeal(d)).sort((a,b) => sc(b) - sc(a));
  const top = new Set(meals.filter(d => d.c !== '主食' && !(d.t.find(x => x.startsWith('#')) || '').match(/サイド|デザート/)).slice(0, 3).map(d => d.id));
  const row = d => { const cau = [];
    if (d.t.includes('揚げ')) cau.push('揚げ物'); if (d.s >= 4 || d.t.includes('塩辛')) cau.push('塩分多め'); if (d.c === '一品' && !d.t.includes('皿') && d.k > T * 1.3) cau.push('エネルギー多め'); if (d.t.includes('マヨ')) cau.push('マヨネーズ'); if (d.t.includes('甘い')) cau.push('甘い');
    const soupTip = d.ss != null ? `<span class="badge" style="background:var(--leafbg);color:var(--leaf)">汁を残すと塩分${r1(d.s - d.ss * 0.7)}g</span>` : '';
    return `<div class="item" role="button" tabindex="0" data-act="pick" data-id="${d.id}"><div class="nm">${esc(d.n)}<div class="badges">${top.has(d.id)?'<span class="badge rec">おすすめ</span>':''}${cau.map(c => `<span class="badge cau">${c}</span>`).join('')}${soupTip}<span class="badge">${esc(d.u)}</span></div></div><div class="kc">${fmt(d.k)} kcal<br>塩分${d.s}g</div></div>`; };
  let h = `<div class="card"><h2>外食のとき</h2><p class="muted" style="margin:0 0 10px">お店の種類を選ぶと、あなたの健診結果に合わせた選び方を出します。食べたものをタップすると記録できます。</p>
   <div class="chips">${GENRES.map(([k,l]) => `<button class="chip" data-act="genre" data-g="${k}" aria-pressed="${k===outGenre}">${l}</button>`).join('')}</div></div>`;
  let tip = GTIPS[outGenre];
  if ((f.bp || f.medBp) && ['麺','定食','丼','コンビニ'].includes(outGenre)) tip += ' 血圧が高めなので、汁物・漬物・しょうゆは特に控えめに。';
  h += `<div class="note ok"><b>選び方のコツ</b><br>${esc(tip)}</div>`;
  const sub = d => (d.t.find(x => x.startsWith('#')) || '').slice(1);
  if (list.some(sub)){
    const order = ['にぎり','軍艦','巻物','そのほか','サイド','デザート',''];
    const by = {}; list.slice().sort((a,b) => sc(b) - sc(a)).forEach(d => { const k = sub(d); (by[k] = by[k] || []).push(d); });
    const names = {にぎり:'にぎり',軍艦:'軍艦',巻物:'巻物',そのほか:'そのほかのすし・丼',サイド:'サイドメニュー・汁物',デザート:'デザート','':'飲み物など'};
    const navs = order.filter(k => by[k]);
    h += `<div class="chips" style="margin-bottom:12px">${navs.map(k => `<a class="chip" style="text-decoration:none;display:inline-flex;align-items:center;color:var(--ink)" href="#g-${order.indexOf(k)}">${names[k]}</a>`).join('')}</div>`;
    navs.forEach(k => h += `<div class="card list" id="g-${order.indexOf(k)}"><h2 style="font-size:18px">${names[k]}</h2>${by[k].map(row).join('')}</div>`);
  } else {
    h += `<div class="card list"><h2 style="font-size:18px">料理</h2>${meals.map(row).join('')}</div>`;
    if (others.length) h += `<div class="card list"><h2 style="font-size:18px">いっしょに頼むなら・飲み物</h2>${others.map(row).join('')}</div>`;
  }
  h += `<p class="muted small">昼・夕1食の目安は約${fmt(T)}kcalです。カロリーと塩分は1人前のおよその値です。</p>`;
  return h;
}

function vLog(){
  const C = calc(); const start = addDays(logDate, -6); const days = [...Array(7)].map((_,i) => addDays(start, i));
  const tots = days.map(d => ({d, ...totals(d), n: Object.values(dayLog(d)).flat().length}));
  const maxK = Math.max(C.E || 1800, ...tots.map(t => t.k)) * 1.1;
  const rec = tots.filter(t => t.n);
  let meals = 0, bal = 0, sweets = 0, alc = 0;
  for (const d of days){ const L = dayLog(d); for (const s of ['朝','昼','夕']){ const it = L[s] || []; if (!it.length) continue; meals++; const b = balance(it); if (b.shu && b.sai && b.fuku) bal++; }
    const all = Object.values(L).flat(); if (all.some(x => BYID[x.id]?.t.includes('甘い'))) sweets++; if (all.some(x => x.c === 'お酒')) alc++; }
  const avgK = rec.length ? rec.reduce((a,t) => a+t.k, 0) / rec.length : 0, avgS = rec.length ? r1(rec.reduce((a,t) => a+t.s, 0) / rec.length) : 0, avgV = rec.length ? Math.round(rec.reduce((a,t) => a+t.v, 0) / rec.length) : 0;
  const adv = [];
  if (rec.length){
    if (C.E && avgK > C.E * 1.1) adv.push(`1日平均 ${fmt(avgK)}kcal で、目安より多めです。夕食のごはんの量と、揚げ物の回数を見直してみましょう。`);
    else if (C.E && avgK < C.E * 0.8) adv.push('目安より少なめです。記録もれがないか確認しましょう。食べる量が減っている場合は、主菜（肉・魚・卵・大豆）をしっかりとりましょう。');
    else adv.push('エネルギーはおおむね目安どおりです。この調子で続けましょう。');
    if (meals && bal / meals < .6) adv.push(`主食・主菜・副菜がそろった食事は ${bal}/${meals} 回。野菜のおかずを1品足すとそろいます。`);
    if (avgS > C.salt) adv.push(`塩分は1日平均 ${avgS}g で、目安（${C.salt}g未満）を超えています。汁物・めんの汁・漬物から減らしましょう。`);
    if (avgV < 350) adv.push(`野菜は1日平均 約${avgV}g。目安の350gまで、あと小鉢${Math.max(1, Math.round((350-avgV)/70))}皿分です。`);
    if (sweets >= 4 && (C.f.tg || C.f.glu || C.f.liv)) adv.push(`甘いものを食べた日が ${sweets}日ありました。中性脂肪・血糖のために回数を減らしましょう。`);
    if (alc >= 6) adv.push('お酒を飲んだ日が6日以上です。週2日は飲まない日をつくりましょう。');
  }
  let h = `<div class="card"><h2>この1週間</h2><div class="datebar" style="margin:6px 0 0"><button data-act="wk" data-n="-7" aria-label="前の週">‹</button><b style="font-size:16px">${jdate(start)} 〜 ${jdate(logDate)}</b><button data-act="wk" data-n="7" aria-label="次の週">›</button></div>
   <div class="week">${C.E ? `<div class="tline" style="bottom:calc(${C.E/maxK*100}% * (150/170) + 20px)"><em>目安 ${fmt(C.E)}</em></div>` : ''}
   ${tots.map(t => `<button class="wk" data-act="pickday" data-d="${t.d}" aria-pressed="${t.d===logDate}" aria-label="${jdate(t.d)} ${fmt(t.k)}kcal"><i class="${!t.n?'none':C.E && t.k > C.E*1.1?'over':''}" style="height:${t.n ? Math.max(4, t.k/maxK*150) : 4}px"></i><span>${parseD(t.d).getDate()}<br>${WD[parseD(t.d).getDay()]}</span></button>`).join('')}</div>
   <div class="stats"><div class="stat"><span>記録した日</span><b>${rec.length}日</b></div><div class="stat"><span>平均</span><b>${rec.length ? fmt(avgK) : '－'}</b><span>kcal/日</span></div><div class="stat"><span>そろった食事</span><b>${bal}/${meals}</b><span>回</span></div></div></div>`;
  h += rec.length ? `<div class="card"><h2>ふりかえり</h2>${adv.map(a => `<p style="margin:6px 0">● ${esc(a)}</p>`).join('')}</div>` : `<div class="note">この週の記録はまだありません。「きょう」の画面で、食べたものを選んで記録しましょう。</div>`;
  const L = dayLog(logDate);
  h += `<div class="card"><h2>${jdate(logDate)} の記録</h2>${SLOTS.map(s => { const it = L[s.k] || []; return `<p style="margin:10px 0 2px;font-weight:700">${s.l}</p>${it.length ? it.map(x => `<div class="dish"><span class="tag t-${esc(x.c)}">${esc(x.c)}</span><span class="nm">${esc(x.n)}${x.q!==1?(BYID[x.id]?.t.includes('皿')?` ${x.q}皿`:` ×${x.q}`):''}</span><span class="kc">${x.k==null?'－':fmt(x.k*x.q)}</span></div>`).join('') : '<span class="muted small">記録なし</span>'}`; }).join('')}
   <button class="btn ghost wide" style="margin-top:12px" data-act="editday">この日を「きょう」の画面で直す</button></div>`;
  return h;
}

    <p class="muted small">BMI25以上の方は、まず「今の体重から3％減」から始めるのも一つの方法です。</p>
    <label class="f">朝ごはん</label><div class="chips">${['毎日食べる','ときどき','食べない'].map(a => `<button class="chip" data-w="bf" data-v="${a}" aria-pressed="${d.life.bf===a}">${a}</button>`).join('')}</div>
    <label class="f">お酒</label><div class="chips">${['飲まない','ときどき','ほぼ毎日'].map(a => `<button class="chip" data-w="drink" data-v="${a}" aria-pressed="${d.life.drink===a}">${a}</button>`).join('')}</div>
    <label class="f">間食（おやつ・甘い飲み物）</label><div class="chips">${['ほとんどしない','ときどき','毎日'].map(a => `<button class="chip" data-w="snack" data-v="${a}" aria-pressed="${d.life.snack===a}">${a}</button>`).join('')}</div>`;
  } else {
    b = `<p class="muted" style="margin-top:0">選んだ食べ物は、献立の提案に出なくなります。</p>
    <div class="chips">${DISLIKES.map(([l]) => `<button class="chip" data-w="dis" data-v="${esc(l)}" aria-pressed="${d.dis.includes(l)}">${esc(l)}</button>`).join('')}</div>
    <label class="f" for="distext">ほかにあれば（「、」で区切る）</label><input id="distext" type="text" value="${esc(d.disText)}" placeholder="例 れんこん、セロリ">
    <div class="note" style="margin-top:12px">食物アレルギーのある方は、外食や市販品の原材料を必ず確認してください。このアプリの食材は主なものだけです。</div>`;
  }
  const last = step === 3;
  openSheet(`<div class="head"><h2>${titles[step]}</h2>${editing ? '<button class="btn sm ghost" data-w="close">閉じる</button>' : ''}</div>
   ${editing ? '' : `<div class="steps">${[0,1,2,3].map(i => `<i class="${i<=step?'on':''}"></i>`).join('')}</div>`}
   <form id="wf">${b}<div class="row" style="margin-top:18px">${!editing && step ? '<button type="button" class="btn ghost" data-w="back">もどる</button>' : ''}<button class="btn" type="submit">${editing ? '保存する' : last ? 'はじめる' : 'つぎへ'}</button></div></form>`);
}
function readStep(){
  const d = draft, v = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
  if (step === 0){ d.p.by = num(v('by')); d.p.bm = num(v('bm')); d.p.ht = num(v('ht')); d.p.wt = num(v('wt')); }
  if (step === 1){ KEN.forEach(([k]) => d.ken[k] = num(v('k_'+k))); d.ken.uprot = v('k_uprot'); }
  if (step === 3){ d.disText = v('distext') || ''; }
}
function validStep(){
  const d = draft;
  if (step === 0){
    if (!d.p.sex) return '性別を選んでください';
    if (!d.p.by || !d.p.bm) return '生まれた年と月を選んでください';
    if (!(d.p.ht >= 100 && d.p.ht <= 220)) return '身長を正しく入れてください（cm）';
    if (!(d.p.wt >= 25 && d.p.wt <= 200)) return '体重を正しく入れてください（kg）';
  }
  return '';
}
$('#panel').addEventListener('click', e => {
  const b = e.target.closest('[data-w]'); if (!b) return; const w = b.dataset.w, v = b.dataset.v;
  if (w === 'close'){ closeSheet(); return; }
  if (w === 'back'){ readStep(); step--; wizard(); return; }
  if (!draft) return;
  if (w === 'sex') draft.p.sex = v;
  else if (['medBp','medGlu','medLip'].includes(w)) draft.ken[w] = draft.ken[w] === 'あり' ? 'なし' : 'あり';
  else if (w === 'act' || w === 'tw') draft.life[w] = +v;
  else if (['bf','drink','snack'].includes(w)) draft.life[w] = v;
  else if (w === 'dis'){ const i = draft.dis.indexOf(v); i < 0 ? draft.dis.push(v) : draft.dis.splice(i, 1); }
  else return;
  readStep(); const y = $('#panel').scrollTop; wizard(); $('#panel').scrollTop = y;
});
$('#panel').addEventListener('submit', e => {
  if (e.target.id !== 'wf') return; e.preventDefault(); readStep();
  const err = validStep(); if (err){ toast(err); return; }
  if (editing || step === 3){ Object.assign(S, {p:draft.p, ken:draft.ken, life:draft.life, dis:draft.dis, disText:draft.disText}); S.done = true; save(); closeSheet(); draft = null; toast('保存しました'); if (!editing) go('me'); else render(); return; }
  step++; wizard();
});

/* ---------- その他・記録の入力 ---------- */
let pending = null;
// 入力欄は作り直さず、検索結果だけを書きかえる（日本語入力の変換中に確定されないように）
function otherResults(){
  const toks = disTokens(), qq = hira(($('#oq')?.value || '').trim()), cat = otherSheet.cat;
  const res = DISHES.filter(d => (!cat || d.c === cat) && (!qq || hira(d.n).includes(qq) || d.i.some(x => hira(x).includes(qq))));
  res.sort((a,b) => (disliked(a,toks) - disliked(b,toks)) || a.n.localeCompare(b.n, 'ja'));
  $('#ores').innerHTML = res.slice(0, 80).map(d => `<div class="item" role="button" tabindex="0" data-o="pick" data-id="${d.id}"><div class="nm">${esc(d.n)}<div class="badges"><span class="badge">${esc(d.c)}</span><span class="badge">${esc(d.u)}</span></div></div><div class="kc">${fmt(d.k)} kcal</div></div>`).join('')
    + (res.length > 80 ? `<p class="muted small">ほかに${res.length - 80}品あります。名前で絞りこんでください。</p>` : '')
    || '<p class="muted">見つかりませんでした。下の「リストにない料理」から入れてください。</p>';
  document.querySelectorAll('[data-o=cat]').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === cat));
}
function otherSheet(cat = ''){
  otherSheet.cat = cat;
  openSheet(`<div class="head"><h2>${SLOTS.find(s=>s.k===curSlot).l}に食べたもの</h2><button class="btn sm ghost" data-o="close">閉じる</button></div>
   <input id="oq" type="search" placeholder="料理名で探す（例 ちゃんぽん、さば）" aria-label="料理名で探す" autocomplete="off" enterkeyhint="search">
   <div class="chips" style="margin:10px 0">${['',...CATS].map(c => `<button class="chip" data-o="cat" data-v="${c}" aria-pressed="${c===cat}">${c||'すべて'}</button>`).join('')}</div>
   <div class="card list" style="padding:4px 12px" id="ores"></div>
   <div class="card"><h2 style="font-size:18px">リストにない料理</h2>
   <label class="f" for="fn">料理名</label><input id="fn" type="text" placeholder="例 だご汁">
   <label class="f">どれに近いですか</label><div class="chips">${CATS.map(c => `<button class="chip" data-o="fc" data-v="${c}">${c}</button>`).join('')}</div>
   <label class="f" for="fk">カロリー（わかれば）</label><div class="unit"><input id="fk" type="number" inputmode="numeric" placeholder="わからなければ空欄"><span>kcal</span></div>
   <button class="btn wide" style="margin-top:14px" data-o="free">記録する</button></div>`);
  otherResults();
  const oq = $('#oq'); let composing = false;
  const later = () => { clearTimeout(otherSheet.t); otherSheet.t = setTimeout(otherResults, 200); };
  oq.addEventListener('compositionstart', () => { composing = true; });
  oq.addEventListener('compositionend', () => { composing = false; later(); });
  oq.addEventListener('input', e => { if (composing || e.isComposing) return; later(); });
  oq.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); oq.blur(); } });
}
function qtySheet(item, back){
  pending = {item, q:1, back};
  const C = calc(), isRice = item.c === '主食' && item.n.startsWith('ごはん'), plate = !!BYID[item.id]?.t.includes('皿');
  pending.plate = plate; pending.soup = 1; const D0 = BYID[item.id]; const hasSoup = D0 && D0.ss != null;
  openSheet(`<div class="head"><h2>${esc(item.n)}</h2><button class="btn sm ghost" data-o="close">閉じる</button></div>
   <p class="muted" style="margin-top:0">${esc(BYID[item.id]?.u || '')}　1人前 ${item.k==null?'－':fmt(item.k)+' kcal'}</p>
   ${isRice && C.rice ? `<button class="btn ghost wide" style="margin-bottom:12px" data-o="myrice">あなたの1食分（${C.rice}g）にする</button>` : ''}
   <label class="f">${plate ? '何皿食べましたか' : 'どのくらい食べましたか'}</label><div class="qty">${(plate ? [[1,'1皿'],[2,'2皿'],[3,'3皿'],[4,'4皿']] : [[0.5,'半分'],[1,'ふつう'],[1.5,'多め'],[2,'2人前']]).map(([v,l]) => `<button class="chip" data-o="q" data-v="${v}" aria-pressed="${v===1}">${l}</button>`).join('')}</div>
   <div style="margin-top:12px;display:flex;justify-content:center;align-items:center;gap:12px"><button class="btn sm ghost" style="width:56px" data-o="qm" aria-label="減らす">－</button><b id="qv" style="font-size:22px;min-width:80px;text-align:center">${plate ? '1皿' : '×1'}</b><button class="btn sm ghost" style="width:56px" data-o="qp" aria-label="増やす">＋</button></div>
   ${hasSoup ? `<label class="f">スープ・つゆはどのくらい飲みましたか</label><div class="qty" style="grid-template-columns:repeat(3,minmax(0,1fr))">${SOUP.map(([v,l]) => `<button class="chip" data-o="soup" data-v="${v}" aria-pressed="${v===1}">${l}</button>`).join('')}</div>
   <p class="muted small" id="soupnote">塩分 ${D0.s}g（スープを全部飲んだ場合）</p>` : ''}
   <button class="btn wide leaf" style="margin-top:16px" data-o="add">記録する</button>`);
}
function refreshQ(){ $('#qv').textContent = pending.plate ? pending.q + '皿' : '×' + pending.q; document.querySelectorAll('[data-o=q]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === pending.q)); }
let freeCat = '';
$('#panel').addEventListener('click', e => {
  const b = e.target.closest('[data-o]'); if (!b) return; const o = b.dataset.o;
  if (o === 'close'){ closeSheet(); return; }
  if (o === 'cat'){ otherSheet.cat = b.dataset.v; otherResults(); return; }
  if (o === 'pick'){ qtySheet(asItem(BYID[b.dataset.id]), 'other'); return; }
  if (o === 'fc'){ freeCat = b.dataset.v; document.querySelectorAll('[data-o=fc]').forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
  if (o === 'free'){ const n = $('#fn').value.trim(); if (!n){ toast('料理名を入れてください'); return; } if (!freeCat){ toast('どれに近いか選んでください'); return; }
    const k = num($('#fk').value); addItems(curDate, curSlot, [{id:null, n, c:freeCat, k, s:null, v:freeCat==='副菜'?70:0, q:1}]); freeCat = ''; closeSheet(); toast('記録しました'); render(); return; }
  if (o === 'myrice'){ const C = calc(); pending.item = riceItem(C); pending.q = 1; $('#panel h2').textContent = pending.item.n; refreshQ(); return; }
  if (o === 'q'){ pending.q = +b.dataset.v; refreshQ(); return; }
  if (o === 'soup'){ pending.soup = +b.dataset.v; document.querySelectorAll('[data-o=soup]').forEach(x => x.setAttribute('aria-pressed', +x.dataset.v === pending.soup)); const D0 = BYID[pending.item.id]; const s = r1(D0.s - D0.ss * (1 - pending.soup)); $('#soupnote').textContent = `塩分 ${s}g・${fmt(D0.k - D0.ks * (1 - pending.soup))}kcal（この飲み方の場合）`; return; }
  if (o === 'qm'){ const st = pending.plate ? 1 : 0.5; pending.q = Math.max(st, r1(pending.q - st)); refreshQ(); return; }
  if (o === 'qp'){ const st = pending.plate ? 1 : 0.5; pending.q = Math.min(pending.plate ? 30 : 10, r1(pending.q + st)); refreshQ(); return; }
  if (o === 'add'){ const D0 = BYID[pending.item.id], it = {...pending.item, q:pending.q};
    if (D0 && D0.ss != null && pending.soup !== 1){ it.k = Math.round(D0.k - D0.ks * (1 - pending.soup)); it.s = r1(D0.s - D0.ss * (1 - pending.soup)); it.n = `${D0.n}（スープ${pending.soup === 0.6 ? '半分' : '飲まない'}）`; }
    addItems(curDate, curSlot, [it]); closeSheet(); toast('記録しました'); if (tab !== 'today') go('today'); else render(); return; }
  if (o === 'part'){ const it = partState.items.filter((_,i) => partState.on[i]); if (!it.length){ toast('食べたものを選んでください'); return; } addItems(curDate, curSlot, it); closeSheet(); toast('記録しました'); render(); return; }
  if (o === 'pt'){ const i = +b.dataset.i; partState.on[i] = !partState.on[i]; b.setAttribute('aria-pressed', partState.on[i]); return; }
  if (o === 'fr'){ const v = b.dataset.v, i = S.fridge.indexOf(v); i < 0 ? S.fridge.push(v) : S.fridge.splice(i, 1); save(); b.setAttribute('aria-pressed', S.fridge.includes(v)); return; }
  if (o === 'frclear'){ S.fridge = []; save(); fridgeSheet(); return; }
  if (o === 'frdone'){ closeSheet(); render(); return; }
  if (o === 'copy'){ const t = $('#bk').value; try { navigator.clipboard.writeText(t).then(() => toast('コピーしました'), () => { $('#bk').select(); toast('選択しました。長押しでコピーしてください'); }); } catch(err){ $('#bk').select(); } return; }
  if (o === 'dl'){ try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([$('#bk').value], {type:'application/json'})); a.download = `ごはんナビ_${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); } catch(err){ toast('この画面では保存できません。コピーを使ってください'); } return; }
  if (o === 'doimport'){ try { const obj = JSON.parse($('#bk').value); if (!obj || !obj.p) throw 0; S = Object.assign(blank(), obj); save(); closeSheet(); toast('読み込みました'); go('today'); } catch(err){ toast('読み込めませんでした。内容を確認してください'); } return; }
  if (o === 'doreset'){ S = blank(); save(); closeSheet(); toast('消しました'); go('today'); return; }
});
$('#panel').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.item')){ e.preventDefault(); e.target.click(); } });
$('#panel').addEventListener('change', e => { if (e.target.id === 'bkfile'){ const fl = e.target.files[0]; if (!fl) return; const rd = new FileReader(); rd.onload = () => { $('#bk').value = rd.result; }; rd.readAsText(fl); } });

let partState = null;
function partSheet(p){
  partState = {items:p.items, on:p.items.map(() => true)};
  openSheet(`<div class="head"><h2>食べたものだけ選ぶ</h2><button class="btn sm ghost" data-o="close">閉じる</button></div>
   <div class="chips" style="flex-direction:column">${p.items.map((x,i) => `<button class="chip leafc" style="text-align:left;border-radius:14px" data-o="pt" data-i="${i}" aria-pressed="true">${esc(x.n)}（${fmt(x.k)} kcal）</button>`).join('')}</div>
   <p class="muted small">ほかに食べたものは、記録したあとに「その他を入力」から足せます。</p>
   <button class="btn wide leaf" style="margin-top:12px" data-o="part">記録する</button>`);
}
function fridgeSheet(){
  openSheet(`<div class="head"><h2>冷蔵庫にあるもの</h2><button class="btn sm ghost" data-o="frdone">決定</button></div>
   <p class="muted" style="margin-top:0">選んだ食材を使う献立が、提案に出やすくなります。</p>
   ${Object.entries(FRIDGE).map(([g, arr]) => `<label class="f">${g}</label><div class="chips">${arr.map(x => `<button class="chip leafc" data-o="fr" data-v="${x}" aria-pressed="${S.fridge.includes(x)}">${x}</button>`).join('')}</div>`).join('')}
   <div class="row" style="margin-top:16px"><button class="btn ghost" data-o="frclear">すべて外す</button><button class="btn" data-o="frdone">この食材で提案する</button></div>`);
}

/* ---------- 画面のボタン ---------- */
$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act, C = calc();
  if (a === 'setup'){ setup(0, false); return; }
  if (a === 'day'){ curDate = addDays(curDate, +b.dataset.n); showProps = false; render(); return; }
  if (a === 'slot'){ curSlot = b.dataset.s; showProps = false; render(); return; }
  if (a === 'showprops'){ showProps = true; render(); return; }
  if (a === 'regen'){ S.regen[curDate+curSlot] = (S.regen[curDate+curSlot] || 0) + 1; save(); render(); return; }
  if (a === 'ate'){ const p = propose(curDate, curSlot, C)[+b.dataset.i]; addItems(curDate, curSlot, p.items); showProps = false; toast('記録しました'); render(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  if (a === 'part'){ partSheet(propose(curDate, curSlot, C)[+b.dataset.i]); return; }
  if (a === 'del'){ const L = S.logs[curDate]; L[curSlot].splice(+b.dataset.i, 1); save(); render(); return; }
  if (a === 'other'){ otherSheet(); return; }
  if (a === 'fridge'){ fridgeSheet(); return; }
  if (a === 'quick'){ qtySheet(asItem(BYID[b.dataset.id])); return; }
  if (a === 'genre'){ outGenre = b.dataset.g; render(); return; }
  if (a === 'pick'){ const d = BYID[b.dataset.id]; curDate = today(); curSlot = d.c === '間食' || d.c === '飲み物' ? (autoSlot()) : autoSlot(); qtySheet(asItem(d)); $('#panel .muted').insertAdjacentHTML('afterend', `<p class="small" style="margin:0 0 8px">きょうの <b>${SLOTS.find(s=>s.k===curSlot).l}</b> に記録します（あとで「きょう」の画面で直せます）</p>`); return; }
  if (a === 'wk'){ logDate = addDays(logDate, +b.dataset.n); render(); return; }
  if (a === 'pickday'){ logDate = b.dataset.d; render(); return; }
  if (a === 'editday'){ curDate = logDate; go('today'); return; }
  if (a === 'edit'){ setup(+b.dataset.step, true); return; }
  if (a === 'fbtag'){ S.fb = S.fb || {tags:[], text:''}; const v = b.dataset.v, i = S.fb.tags.indexOf(v); i < 0 ? S.fb.tags.push(v) : S.fb.tags.splice(i, 1); save(); b.setAttribute('aria-pressed', S.fb.tags.includes(v)); return; }
  if (a === 'fbcopy'){ const days = Object.keys(S.logs).filter(d => Object.values(S.logs[d]).flat().length).length; const meals = Object.values(S.logs).reduce((n, L) => n + Object.values(L).filter(x => x.length).length, 0);
    const txt = `【ごはんナビ ご意見】${VERSION}\n記録した日数：${days}日／食事の記録：${meals}回\n${(S.fb.tags||[]).map(x => '・' + x).join('\n')}\n${S.fb.text || ''}`.trim();
    const done = () => toast('コピーしました'); const fail = () => { const el = $('#fbtext'); el.select(); toast('長押しでコピーしてください'); };
    try { navigator.clipboard.writeText(txt).then(done, fail); } catch(err){ fail(); } return; }
  if (a === 'export'){ openSheet(`<div class="head"><h2>データを書き出す</h2><button class="btn sm ghost" data-o="close">閉じる</button></div>
     <p class="muted" style="margin-top:0">下の文字がデータです。「ファイルに保存」か「コピー」をして、新しいスマホの「読み込む」で使ってください。健診結果が入っているので、他の人に送らないでください。</p>
     <textarea id="bk" readonly>${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:10px"><button class="btn ghost" data-o="dl">ファイルに保存</button><button class="btn" data-o="copy">コピー</button></div>`); return; }
  if (a === 'import'){ openSheet(`<div class="head"><h2>データを読み込む</h2><button class="btn sm ghost" data-o="close">閉じる</button></div>
     <p class="muted" style="margin-top:0">書き出したファイルを選ぶか、コピーした文字を貼り付けてください。今のデータは置きかわります。</p>
     <input id="bkfile" type="file" accept=".json,application/json,text/plain" style="margin-bottom:10px"><textarea id="bk" placeholder="ここに貼り付け"></textarea>
     <button class="btn wide" style="margin-top:10px" data-o="doimport">読み込む</button>`); return; }
  if (a === 'reset'){ openSheet(`<div class="head"><h2>すべてのデータを消しますか？</h2></div><p>入力した健診結果・設定・食事の記録がすべて消えます。元にはもどせません。</p>
     <div class="row"><button class="btn ghost" data-o="close">やめる</button><button class="btn" style="background:var(--warn);border-color:var(--warn)" data-o="doreset">消す</button></div>`); return; }
});
$('#view').addEventListener('input', e => { if (e.target.id === 'fbtext'){ S.fb = S.fb || {tags:[], text:''}; S.fb.text = e.target.value; save(); } });
$('#fbjump').addEventListener('click', () => { if (!S.done){ toast('はじめに入力をすませてください'); return; } go('me'); setTimeout(() => document.getElementById('feedback')?.scrollIntoView({behavior:'smooth'}), 50); });
$('#view').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.item')){ e.preventDefault(); e.target.click(); } });

go(S.done ? 'today' : 'today');
window.__app = {calc, propose, S: () => S, setS: o => { S = Object.assign(blank(), o); save(); render(); }, go};
}
</script>
